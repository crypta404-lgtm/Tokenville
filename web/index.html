<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14111c; --surface: #1c1828; --surface2: #241f33; --hover: #2b2540; --line: #2f2944;
    --ink: #ece9f6; --dim: #8b85a6; --faint: #5e5878;
    --accent: #ff8a5c; --good: #6ee7a0; --warn: #ffd166; --bad: #ff7b6b;
    --pixel: 'Pixelify Sans', ui-monospace, monospace;
    --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font: 13px/1.45 var(--ui); }
  button { font: inherit; color: inherit; }
  body { display: grid; grid-template-rows: 52px 1fr; }

  /* barra superior */
  header { display: flex; align-items: center; gap: 22px; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { font: 600 18px var(--pixel); letter-spacing: .5px; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; height: 100%; }
  .tab { cursor: pointer; background: none; border: none; padding: 0 14px; color: var(--dim); font-weight: 500; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .live { margin-left: auto; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .live b { color: var(--good); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 7px; box-shadow: 0 0 0 0 #6ee7a088; animation: pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px #6ee7a000; } 100% { box-shadow: 0 0 0 0 #6ee7a000; } }

  .view { display: none; min-height: 0; }
  .view.on { display: grid; }

  /* escritório */
  #view-office { grid-template-columns: 264px 1fr; }
  aside { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px; }
  aside h2, .tile h2 { font: 600 10.5px var(--ui); margin: 0 8px 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 1.2px; }
  .chat { display: block; width: 100%; text-align: left; cursor: pointer; background: none; border: none; border-radius: 8px; padding: 9px 10px; margin-bottom: 2px; }
  .chat:hover { background: var(--hover); }
  .chat.on { background: var(--surface2); box-shadow: inset 2px 0 0 var(--accent); }
  .chat .t { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat .m { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; font-size: 10px; line-height: 16px; padding: 0 6px; margin-left: 6px; border-radius: 8px; color: #10261a; background: var(--good); font-weight: 600; vertical-align: 1px; }
  .badge.busy { background: var(--warn); color: #2e2208; }
  main.office { position: relative; min-width: 0; background: radial-gradient(ellipse at center, #1b1726 0%, var(--bg) 70%); }
  #office { position: absolute; inset: 16px; display: flex; align-items: center; justify-content: center; }
  #office svg { display: block; max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 10px 40px #00000066; }
  #status { position: absolute; left: 16px; bottom: 12px; color: #ffb08a; font-size: 12px; }

  /* tokenômetro */
  #view-tokens { overflow-y: auto; padding: 20px 22px 110px; display: none; align-content: start; gap: 14px; grid-template-columns: repeat(12, 1fr); }
  #view-tokens.on { display: grid; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi { grid-column: span 2; }
  .kpi h2 { margin: 0 0 6px; }
  .kpi .v { font: 600 26px var(--pixel); }
  .kpi .s { color: var(--dim); font-size: 11.5px; }
  .wide { grid-column: span 8; } .side { grid-column: span 4; } .half { grid-column: span 6; } .full { grid-column: span 12; }
  @media (max-width: 1150px) { .kpi { grid-column: span 4; } .wide, .side, .half { grid-column: span 12; } }
  .tile svg { display: block; width: 100%; height: auto; font-family: var(--ui); }
  .legend { display: flex; gap: 16px; color: var(--dim); font-size: 11.5px; margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td, th { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  th { color: var(--faint); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.link { cursor: pointer; } tr.link:hover td { background: var(--hover); }
  .note { color: var(--dim); font-size: 11.5px; margin-top: 10px; line-height: 1.5; }
  .split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface2); margin: 6px 0 12px; }
  .split div { height: 100%; }

  /* modos: canto inferior direito */
  #modes { position: fixed; right: 18px; bottom: 18px; z-index: 10; display: flex; flex-direction: column; gap: 8px; background: #1c1828ee; backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px #00000077; padding: 12px; width: 244px; }
  #modes .h { color: var(--faint); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; display: flex; justify-content: space-between; align-items: center; }
  #modes .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mode { cursor: pointer; background: var(--surface2); border: 1px solid transparent; border-radius: 9px; padding: 8px 9px; text-align: left; transition: background .15s, border-color .15s; }
  .mode:hover { background: var(--hover); }
  .mode b { display: block; font: 600 12.5px var(--pixel); }
  .mode span { color: var(--dim); font-size: 10.5px; }
  .mode.on { border-color: var(--accent); background: #2e2230; }
  .mode[data-mode="ultra"] { grid-column: span 2; background: linear-gradient(90deg, #173323, #1c2a2a); }
  .mode[data-mode="ultra"] b { color: var(--good); }
  .mode[data-mode="ultra"].on { border-color: var(--good); box-shadow: 0 0 18px #6ee7a033; }
  #modes.min .row, #modes.min .hint { display: none; }
  #modes .hint { color: var(--dim); font-size: 11px; }
  #modeToggle { cursor: pointer; background: none; border: none; color: var(--dim); padding: 0 2px; font-size: 13px; }

  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #2f2944; border-radius: 5px; border: 2px solid var(--surface); }
</style>
</head>
<body>
  <header>
    <div class="brand" id="brand">🏙️ Tokenville</div>
    <nav class="tabs">
      <button class="tab on" data-view="office" id="tabOffice"></button>
      <button class="tab" data-view="tokens" id="tabTokens"></button>
    </nav>
    <div class="live" id="liveHead"><span class="dot"></span></div>
  </header>

  <section class="view on" id="view-office">
    <aside>
      <h2 id="chatsTitle"></h2>
      <div id="chats"></div>
    </aside>
    <main class="office">
      <div id="office"></div>
      <div id="status"></div>
    </main>
  </section>

  <section class="view" id="view-tokens"></section>

  <div id="modes">
    <div class="h"><span id="modesTitle"></span><button id="modeToggle">▾</button></div>
    <div class="row" id="modeButtons"></div>
    <div class="hint" id="modeHint"></div>
  </div>

  <script src="office.js"></script>
</body>
</html>
